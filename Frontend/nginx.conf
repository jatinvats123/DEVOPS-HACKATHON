server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the exact nginx version to the internet.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA shell must NOT be cached, or a browser keeps loading an old
    # index.html that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths are routes, not missing files, so they
    # fall through to the shell rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening for a static host. The backend sets its own headers via
    # helmet; this image serves only the bundle.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
