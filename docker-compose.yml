# Local full-stack run.
# The frontend is built into Backend/public/dist and served by the backend,
# so this is a single service (same topology as the Render deployment).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./Backend
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ./Backend/.env
    environment:
      # Override so the container talks to the mongo service, not localhost
      - MONGO_URL=mongodb://mongo:27017/watchtower
      - NODE_ENV=production
      - PORT=8000
      - CORS_ORIGIN=http://localhost:8000
      - FRONTEND_URL=http://localhost:8000
    depends_on:
      - mongo

volumes:
  mongo_data:
# The SPA bundle is no longer committed to git. Build it into
# Backend/public/dist before `docker compose up` (from the repo root):
#   npm run install:all && npm run build
# (A self-contained multi-stage image build lands in Phase 5.)
