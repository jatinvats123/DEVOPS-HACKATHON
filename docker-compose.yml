services:
  backend:
    build: ./Backend
    ports:
      - "3000:3000"
    volumes:
      - ./Backend:/app
      - Backend_node_modules:/app/node_modules
  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - Frontend_node_modules:/app/node_modules
volumes:
  Backend_node_modules:
  Frontend_node_modules:
