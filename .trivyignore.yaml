# Trivy exceptions.
#
# This file exists so Trivy and `scripts/audit-gate.mjs` agree. Two scanners
# disagreeing about the same dependency tree is how a team learns to ignore
# both — one says the build is fine, the other says it is not, and whichever
# shouts less gets muted.
#
# Every entry carries a statement explaining why the vulnerability is not
# reachable, and an expiry date. Past that date Trivy stops honouring the
# entry and the build fails again, which forces a re-assessment rather than
# letting an exception quietly become permanent.
#
# The same advisory and the same reasoning are recorded in
# scripts/audit-gate.mjs. Both must be updated together.

vulnerabilities:
  - id: GHSA-qwww-vcr4-c8h2
    paths:
      - Frontend/package-lock.json
    statement: >-
      React Router RSC-mode CSRF bypass. WatchTower is a client-only SPA: it
      uses createBrowserRouter + RouterProvider with no server rendering, no
      server actions, and no RSC APIs anywhere in Frontend/src (verified by
      grepping for unstable_*, matchRSCServerRequest and createStaticHandler).
      The vulnerable code path is not reachable.

      The fix is react-router 8.x, which requires Node >= 22.22.0. Adopting it
      would drop the Node 20 support that both the CI matrix and the runtime
      base image target, which is a larger regression than the risk being
      carried. Deferred to the Node 22 baseline migration.
    expired_at: 2026-10-31
