name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you deploying manually?'
        required: false

# Never run two deploys at once, and never cancel one midway — an interrupted
# deploy leaves the service in an unknown state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  publish:
    name: Build & publish images
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          # Tag with the commit SHA as well as `latest`: `latest` is what runs,
          # the SHA is what you roll back TO. A rollback target that moves is
          # not a rollback target.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [publish]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://watchtower-monitoring.onrender.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment secrets are present
        # Fail loudly and early rather than sending an unauthenticated request
        # and interpreting the 401 as "deploy finished".
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          missing=0
          [ -n "$RENDER_API_KEY" ]    || { echo "::error::RENDER_API_KEY is not set"; missing=1; }
          [ -n "$RENDER_SERVICE_ID" ] || { echo "::error::RENDER_SERVICE_ID is not set"; missing=1; }
          exit $missing

      - name: Record the currently live deploy
        # Captured BEFORE anything changes. This is the rollback target; without
        # it, "roll back" means "guess which deploy was good".
        id: previous
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          previous=$(curl -sf \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
            | jq -r '[.[].deploy | select(.status == "live")] | first | .id // empty')

          if [ -z "$previous" ]; then
            echo "::warning::no live deploy found — automatic rollback will not be possible"
          else
            echo "current live deploy: $previous"
          fi
          echo "id=$previous" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          deploy=$(curl -sf -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            | jq -r '.id')

          [ -n "$deploy" ] && [ "$deploy" != "null" ] || { echo "::error::deploy was not accepted"; exit 1; }
          echo "triggered deploy: $deploy"
          echo "id=$deploy" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy to go live
        id: wait
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.id }}
        run: |
          # Render's free tier is slow to build; 20 minutes is generous but a
          # hung deploy must still terminate rather than run to the job limit.
          for i in $(seq 1 120); do
            status=$(curl -sf \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')
            echo "[$((i*10))s] status: $status"

            case "$status" in
              live)
                echo "deploy is live"
                exit 0
                ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::deploy finished in state: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::deploy did not reach a terminal state within 20 minutes"
          exit 1

      - name: Post-deploy health check
        id: health
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://watchtower-monitoring.onrender.com' }}
        run: |
          # "The platform says it deployed" and "the service actually works" are
          # different claims. Only the second one is worth trusting.
          #
          # Free-tier instances cold-start, so allow retries before concluding
          # the release is bad.
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 "$BASE_URL/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "health check passed after ${i} attempt(s)"
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "::error::service did not return a healthy response after deploy"
          exit 1

      - name: Roll back to the previous deploy
        # Runs only when the deploy or the health check failed AND we captured a
        # known-good target.
        if: failure() && steps.previous.outputs.id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PREVIOUS_DEPLOY: ${{ steps.previous.outputs.id }}
        run: |
          echo "::warning::rolling back to $PREVIOUS_DEPLOY"
          curl -sf -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"deployId\":\"$PREVIOUS_DEPLOY\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/rollback" \
            || { echo "::error::ROLLBACK FAILED — service needs manual intervention"; exit 1; }

          echo "rollback requested; verifying the service recovers"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "${{ vars.PRODUCTION_URL || 'https://watchtower-monitoring.onrender.com' }}/api/health" || true)
            echo "post-rollback attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "::notice::rollback succeeded — service is healthy on the previous release"
              exit 1   # still fail the run: a rollback is not a successful deploy
            fi
            sleep 10
          done
          echo "::error::service is UNHEALTHY after rollback — manual intervention required"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Previous deploy | \`${{ steps.previous.outputs.id || 'none' }}\` |"
            echo "| New deploy | \`${{ steps.trigger.outputs.id || 'not triggered' }}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
